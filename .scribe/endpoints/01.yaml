name: Reservas
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/agendamentos
    metadata:
      custom: []
      groupName: Reservas
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Reservar um horário'
      description: |-
        Cria um agendamento `pendente`, que segura o horário por 15 minutos, e
        devolve o Pix do sinal (copia e cola e QR Code em base64). Pago o sinal,
        o webhook confirma o agendamento e o cliente recebe um e-mail.

        O cliente é identificado pelo e-mail, sem precisar de conta: na próxima
        reserva, nome e telefone são atualizados. O preço e o sinal ficam
        gravados no agendamento, e mudanças posteriores no serviço não os alteram.

        Limite: 5 reservas por minuto por IP.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      profissional_id:
        custom: []
        name: profissional_id
        description: 'Id do profissional (ativo).'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      servico_id:
        custom: []
        name: servico_id
        description: 'Id do serviço (ativo) que o profissional realiza.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      inicio:
        custom: []
        name: inicio
        description: 'Início do horário em ISO 8601, como devolvido pela disponibilidade. Outros fusos são convertidos para o horário de Brasília. O campo value deve ser uma data válida.'
        required: true
        example: '2026-11-30T10:00:00-03:00'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      cliente:
        custom: []
        name: cliente
        description: 'Dados de contato de quem vai ser atendido.'
        required: true
        example: []
        type: object
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      cliente.nome:
        custom: []
        name: cliente.nome
        description: 'Nome do cliente. O campo value não pode ter mais de 255 caracteres.'
        required: true
        example: 'Maria Silva'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      cliente.email:
        custom: []
        name: cliente.email
        description: 'E-mail: identifica o cliente e recebe a confirmação, o lembrete e o link de cancelamento. O campo value deve ser um endereço de e-mail válido. O campo value não pode ter mais de 255 caracteres.'
        required: true
        example: maria@example.com
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      cliente.telefone:
        custom: []
        name: cliente.telefone
        description: 'Telefone com DDD. Must match the regex /^[0-9()+\-\s]{10,20}$/.'
        required: true
        example: '(11) 91234-5678'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      profissional_id: 1
      servico_id: 1
      inicio: '2026-11-30T10:00:00-03:00'
      cliente:
        nome: 'Maria Silva'
        email: maria@example.com
        telefone: '(11) 91234-5678'
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"data": {"id": 42, "status": {"valor": "pendente", "rotulo": "Pendente"}, "inicio": "2026-11-30T10:00:00-03:00", "fim": "2026-11-30T11:00:00-03:00", "expira_em": "2026-11-27T08:15:00-03:00", "valor_centavos": 12000, "sinal_centavos": 3000, "profissional": {"id": 1, "nome": "Ana Souza"}, "servico": {"id": 1, "nome": "Corte feminino", "duracao_minutos": 60}, "cliente": {"nome": "Maria Silva", "email": "maria@example.com"}, "pagamento": {"status": {"valor": "pendente", "rotulo": "Aguardando pagamento"}, "valor_centavos": 3000, "expira_em": "2026-11-27T08:15:00-03:00", "pix": {"copia_e_cola": "00020126580014br.gov.bcb.pix0136...6304ABCD", "qr_code_base64": "iVBORw0KGgoAAAANSUhEUgAA..."}}}}'
        headers: []
        description: 'Reserva criada'
      -
        custom: []
        status: 409
        content: '{"message": "O horário escolhido não está disponível. Consulte os horários livres e tente outro."}'
        headers: []
        description: 'Horário ocupado, fora da grade ou da jornada, ou fora da antecedência'
      -
        custom: []
        status: 422
        content: '{"message": "O campo nome é obrigatório. (e mais 1 erro)", "errors": {"cliente.nome": ["O campo nome é obrigatório."], "servico_id": ["Este profissional não realiza o serviço escolhido."]}}'
        headers: []
        description: 'Dados inválidos'
      -
        custom: []
        status: 429
        content: '{"message": "Muitas requisições. Tente novamente em instantes."}'
        headers: []
        description: 'Limite de reservas por IP'
      -
        custom: []
        status: 503
        content: '{"message": "Não foi possível gerar o Pix agora. Tente reservar novamente em instantes."}'
        headers: []
        description: 'Pix não pôde ser gerado (a reserva é desfeita)'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
